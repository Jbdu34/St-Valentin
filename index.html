<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💘 Saint-Valentin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    /* ❤️ TEXTE BACKGROUND */
    .love-bg {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 900;
      color: rgba(255, 255, 255, 0.12);
      text-align: center;
      z-index: 0;
      pointer-events: none;
      text-transform: uppercase;
    }

    /* 💕 COEURS FLOTTANTS */
    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-120vh) scale(1.4);
        opacity: 0;
      }
    }

    /* CONTENEUR */
    .app {
      position: relative;
      width: 100%;
      max-width: 640px;
      padding: 24px;
      z-index: 2;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 22px;
      padding: 36px 26px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.25);
      transition: opacity 0.4s ease, transform 0.4s ease;
      backdrop-filter: blur(4px);
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
      position: absolute;
    }

    .visible {
      opacity: 1;
      transform: scale(1);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 26px;
      color: #c2185b;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
      min-height: 64px;
      flex-wrap: wrap;
    }

    button {
      padding: 16px 34px;
      border-radius: 999px;
      border: none;
      font-size: 1.15rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yesButton {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
      box-shadow: 0 10px 26px rgba(255, 77, 109, 0.5);
    }

    #yesButton:hover {
      transform: scale(1.12);
    }

    #noButton {
      background: #ffe4ec;
      color: #b32653;
      box-shadow: 0 6px 18px rgba(179, 38, 83, 0.35);
      position: relative;
      cursor: default;
      user-select: none;
      transition: left 0.25s ease, top 0.25s ease;
    }

    /* ⏳ COUNTDOWN */
    .countdown {
      font-size: 4rem;
      font-weight: bold;
      color: #c2185b;
      animation: pop 0.4s ease;
    }

    .result-message {
      font-size: 1.9rem;
      color: #c2185b;
      margin-bottom: 22px;
      animation: pop 0.6s ease forwards;
    }

    .gif-container {
      max-width: 360px;
      margin: auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0,0,0,0.3);
      animation: fadeZoom 0.6s ease forwards;
    }

    .gif-container img {
      width: 100%;
      display: block;
    }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeZoom {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.6rem; }
      button { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- TEXTE AMOUR -->
  <div class="love-bg">JE T’AIME<br>AMANDINE</div>

  <!-- COEURS -->
  <div class="hearts" id="hearts"></div>

  <!-- AUDIO -->
  <audio id="loveSound" preload="auto">
    <!-- Tu peux remplacer le son -->
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-magic-sweep-game-trophy-257.mp3" type="audio/mpeg">
  </audio>

  <div class="app">

    <!-- QUESTION -->
    <div id="questionCard" class="card visible">
      <h1>Veux-tu être ma Valentine ? 💖</h1>
      <div class="buttons">
        <button id="yesButton">Oui 💘</button>
        <button id="noButton">Non 😢</button>
      </div>
    </div>

    <!-- COUNTDOWN -->
    <div id="countdownCard" class="card hidden">
      <div class="countdown" id="countdown">3</div>
    </div>

    <!-- RESULTAT -->
    <div id="resultCard" class="card hidden">
      <div class="result-message">Je t’aime Amandine 💕</div>
      <div class="gif-container">
        <img src="image/Jb.jpg" alt="Valentine">
      </div>
    </div>

  </div>

  <script>
    const yesButton = document.getElementById("yesButton");
    const noButton = document.getElementById("noButton");
    const questionCard = document.getElementById("questionCard");
    const countdownCard = document.getElementById("countdownCard");
    const countdownEl = document.getElementById("countdown");
    const resultCard = document.getElementById("resultCard");
    const app = document.querySelector(".app");
    const heartsContainer = document.getElementById("hearts");
    const sound = document.getElementById("loveSound");

    let noInit = false;

    yesButton.addEventListener("click", () => {
      sound.play();
      questionCard.classList.add("hidden");
      countdownCard.classList.remove("hidden");

      let count = 3;
      countdownEl.textContent = count;

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.textContent = count;
        } else {
          clearInterval(interval);
          countdownCard.classList.add("hidden");
          resultCard.classList.remove("hidden");
          launchConfetti();
        }
      }, 1000);
    });

    function initNoButton() {
      if (noInit) return;
      const rect = noButton.getBoundingClientRect();
      const appRect = app.getBoundingClientRect();
      app.appendChild(noButton);
      noButton.style.position = "absolute";
      noButton.style.left = rect.left - appRect.left + "px";
      noButton.style.top = rect.top - appRect.top + "px";
      noInit = true;
    }

    function moveNo() {
      initNoButton();
      const maxX = app.clientWidth - noButton.offsetWidth;
      const maxY = app.clientHeight - noButton.offsetHeight;
      noButton.style.left = Math.random() * maxX + "px";
      noButton.style.top = Math.random() * maxY + "px";
    }

    noButton.addEventListener("mouseenter", moveNo);
    noButton.addEventListener("click", e => {
      e.preventDefault();
      moveNo();
    });

    function spawnHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 12 + Math.random() * 24 + "px";
      heart.style.animationDuration = 6 + Math.random() * 6 + "s";
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 12000);
    }

    setInterval(spawnHeart, 350);

    function launchConfetti() {
      for (let i = 0; i < 40; i++) {
        setTimeout(spawnHeart, i * 60);
      }
    }
  </script>
</body>
</html>
