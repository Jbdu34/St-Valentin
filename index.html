<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💘 Saint-Valentin</title>

<style>
:root{
  --bg1:#ff9a9e;
  --bg2:#fad0c4;
  --card:#ffffffee;
  --text:#c2185b;
}

body.night{
  --bg1:#1c1b2d;
  --bg2:#3a2a4f;
  --card:#2a2438ee;
  --text:#ff8fb1;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Segoe UI",system-ui,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  overflow:hidden;
  transition:background .6s ease;
}

/* TEXTE AMOUR BACKGROUND */
.love-bg{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(3rem,10vw,8rem);
  font-weight:900;
  color:rgba(255,255,255,0.1);
  text-align:center;
  pointer-events:none;
  z-index:0;
}

/* COEURS FLOTTANTS */
.hearts{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.heart{
  position:absolute;
  bottom:-20px;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  from{transform:translateY(0) scale(1);opacity:1;}
  to{transform:translateY(-120vh) scale(1.4);opacity:0;}
}

/* CONTENEUR */
.app{
  max-width:640px;
  padding:24px;
  z-index:2;
  text-align:center;
  position:relative;
}

.card{
  background:var(--card);
  border-radius:22px;
  padding:36px 26px;
  box-shadow:0 30px 70px rgba(0,0,0,0.25);
  transition:opacity .4s ease,transform .4s ease;
  color:var(--text);
}

.hidden{
  opacity:0;
  pointer-events:none;
  transform:scale(.95);
  position:absolute;
}

h1{
  font-size:2rem;
  margin-bottom:26px;
}

/* BOUTONS */
.buttons{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

button{
  padding:16px 34px;
  border-radius:999px;
  border:none;
  font-size:1.1rem;
  cursor:pointer;
}

#yesButton{
  background:linear-gradient(135deg,#ff4d6d,#ff758f);
  color:white;
}

#noButton{
  background:#ffe4ec;
  color:#b32653;
  position:relative;
  user-select:none;
}

/* COUNTDOWN */
.countdown{
  font-size:4rem;
  font-weight:bold;
}

/* TEXTE MANUSCRIT */
.handwritten{
  font-family:"Segoe Script","Brush Script MT",cursive;
  font-size:2.1rem;
  min-height:2.6em;
  margin-bottom:12px;
}

/* SIGNATURE */
.signature{
  font-family:"Segoe Script","Brush Script MT",cursive;
  font-size:1.4rem;
  opacity:0;
  margin-bottom:16px;
  transition:opacity .6s ease;
}

/* IMAGE / GIF (CORRECTION DEFORMATION) */
.gif-container{
  max-width:360px;
  margin:auto;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 18px 45px rgba(0,0,0,0.3);
}

.gif-container img{
  width:100%;
  height:100%;
  object-fit:cover; /* ✅ PAS DE DEFORMATION */
  display:block;
}

/* MODE NUIT */
.mode-toggle{
  position:fixed;
  top:16px;
  right:16px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--card);
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  z-index:5;
}

/* BOUTON SECRET */
.secret{
  margin-top:14px;
  font-size:.9rem;
  opacity:0;
  cursor:pointer;
  transition:.4s;
}
.secret.visible{opacity:.7;}

@media(max-width:480px){
  h1{font-size:1.6rem;}
  button{width:100%;}
}
</style>
</head>

<body>

<div class="love-bg">JE T’AIME<br>AMANDINE</div>
<div class="hearts" id="hearts"></div>
<div class="mode-toggle" id="modeToggle">🌙</div>

<!-- SON LOCAL -->
<audio id="loveSound" preload="auto">
  <source src="sound/love.mp3" type="audio/mpeg">
</audio>

<div class="app">

  <!-- QUESTION -->
  <div id="questionCard" class="card">
    <h1>Veux-tu être ma Valentine ? 💖</h1>
    <div class="buttons">
      <button id="yesButton">Oui 💘</button>
      <button id="noButton">Non 😢</button>
    </div>
  </div>

  <!-- COUNTDOWN -->
  <div id="countdownCard" class="card hidden">
    <div class="countdown" id="countdown">3</div>
  </div>

  <!-- RESULTAT -->
  <div id="resultCard" class="card hidden">
    <div class="handwritten" id="handText"></div>
    <div class="signature" id="signature">— Pour toujours, JB</div>
    <div class="gif-container">
      <img src="image/Jb.jpg" alt="Valentine">
    </div>
    <div class="secret" id="secret">💌 (psst…)</div>
  </div>

</div>

<script>
const yes=document.getElementById("yesButton");
const no=document.getElementById("noButton");
const qc=document.getElementById("questionCard");
const cc=document.getElementById("countdownCard");
const rc=document.getElementById("resultCard");
const cd=document.getElementById("countdown");
const txt=document.getElementById("handText");
const sig=document.getElementById("signature");
const secret=document.getElementById("secret");
const hearts=document.getElementById("hearts");
const sound=document.getElementById("loveSound");
const mode=document.getElementById("modeToggle");

/* CLICK OUI */
yes.onclick=()=>{
  sound.currentTime=0;
  sound.play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate(120);

  no.style.display="none";
  qc.classList.add("hidden");
  cc.classList.remove("hidden");

  let c=3;
  cd.textContent=c;

  const timer=setInterval(()=>{
    if(navigator.vibrate) navigator.vibrate(50);
    c--;
    if(c>0){
      cd.textContent=c;
    }else{
      clearInterval(timer);
      cc.classList.add("hidden");
      rc.classList.remove("hidden");
      writeText("Je t’aime Amandine 💕");
    }
  },1000);
};

/* TEXTE MANUSCRIT + VIBRATION PAR LETTRE */
function writeText(text){
  let i=0;
  txt.textContent="";
  const interval=setInterval(()=>{
    txt.textContent+=text[i];
    if(navigator.vibrate) navigator.vibrate(20);
    i++;
    if(i>=text.length){
      clearInterval(interval);
      sig.style.opacity=1;
      secret.classList.add("visible");
    }
  },90);
}

/* BOUTON SECRET */
secret.onclick=()=>{
  alert("Tu es la plus belle chose qui me soit arrivée 💖");
};

/* COEURS */
function spawnHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent="💗";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=12+Math.random()*24+"px";
  h.style.animationDuration=6+Math.random()*6+"s";
  hearts.appendChild(h);
  setTimeout(()=>h.remove(),12000);
}
setInterval(spawnHeart,350);

/* MODE NUIT */
mode.onclick=()=>{
  document.body.classList.toggle("night");
  mode.textContent=document.body.classList.contains("night")?"☀️":"🌙";
};

/* BOUTON NON QUI FUIT */
no.onmouseenter=()=>{
  no.style.position="absolute";
  no.style.left=Math.random()*80+"%";
  no.style.top=Math.random()*80+"%";
};
</script>

</body>
</html>
